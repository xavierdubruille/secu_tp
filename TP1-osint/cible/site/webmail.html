<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>ACME Webmail - Connexion</title>
<style>
body{font:16px/1.5 system-ui,Arial,sans-serif;background:#eef2f7;color:#1e293b;margin:0}
.box{max-width:360px;margin:7vh auto;background:#fff;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.08);padding:2rem}
h1{font-size:1.3rem;border-bottom:3px solid #0ea5e9;padding-bottom:.6rem;margin-top:0}
label{display:block;margin:.9rem 0 .25rem;font-size:.9rem;color:#475569}
input{width:100%;box-sizing:border-box;padding:.6rem;border:1px solid #cbd5e1;border-radius:6px}
button{margin-top:1.3rem;width:100%;padding:.7rem;background:#0ea5e9;color:#fff;border:0;border-radius:6px;font-weight:700;cursor:pointer}
.foot{margin-top:1rem;font-size:.75rem;color:#94a3b8;text-align:center}
</style></head><body>
<div class="box">
<h1>ACME Webmail</h1>
<p style="font-size:.9rem;color:#475569">Accès réservé au personnel ACME-BE.</p>
<!-- login.php (KH) : HTTPS + MFA prevus apres la migration VPN. en attendant, identifiants transmis en clair. -->
<form method="post" action="login.php">
<label for="u">Adresse e-mail</label>
<input id="u" name="email" type="email" placeholder="initiale.nom@acme-be.example" autocomplete="username">
<label for="p">Mot de passe</label>
<input id="p" name="password" type="password" autocomplete="current-password">
<button type="submit">Se connecter</button>
</form>
<div class="foot">ACME-BE - portail fictif pour exercice pedagogique</div>
</div>
</body></html>
