# Config nginx de la cible : le site par défaut + listing du dossier /files/
# (la « médiathèque » liée depuis l'accueil). Mauvaise pratique volontaire :
# le directory listing expose tous les fichiers, y compris ceux non liés.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /files/ {
        autoindex on;
    }
}
